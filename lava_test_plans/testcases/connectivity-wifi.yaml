    {"name": "WiFi_Manual_IP", "path": "Runner/suites/Connectivity/WiFi/WiFi_Manual_IP/WiFi_Manual_IP.yaml", "include": (WIFI_SSID_NAME is defined and WIFI_SSID_NAME), "params": {"SSID": WIFI_SSID_NAME|default(""), "PASSWORD": WIFI_SSID_PASSWORD|default("")}, "expected": ["WiFi_Manual_IP"]}
] %}
